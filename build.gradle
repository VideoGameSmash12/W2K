plugins {
    id("common-conventions")
    id("modern-minecraft-conventions")
}

version = project.mod_version
group = "me.videogamesm12"

dependencies {
    minecraft "com.mojang:minecraft:26.2"

    include "net.kyori:adventure-api:${project.adventure_version}"
    include "net.kyori:adventure-key:${project.adventure_version}"
    include "net.kyori:adventure-nbt:${project.adventure_version}"
    include "net.kyori:adventure-text-serializer-json:${project.adventure_version}"
    include "net.kyori:adventure-text-serializer-gson:${project.adventure_version}"
    include "net.kyori:adventure-text-serializer-plain:${project.adventure_version}"
    include "net.kyori:examination-api:1.3.0"
    include "net.kyori:option:1.0.0"
}