ext {
    remap = true
}

dependencies {
    minecraft "com.mojang:minecraft:1.20.1"
    mappings "net.fabricmc:yarn:1.20.1+build.10:v2"

    implementation project(":Blackbox")

    // Some mods rely on the Fabric API for one reason or another.
    modApi "net.fabricmc.fabric-api:fabric-api:0.28.5+1.14"
}

subprojects {
    repositories {
        exclusiveContent {
            forRepository { maven { url = "https://api.modrinth.com/maven" } }
            filter { includeGroup "maven.modrinth" }
        }
        exclusiveContent {
            forRepository { maven { url = "https://jitpack.io/" } }
            filter { includeGroup "com.github.VideoGameSmash12" }
        }
    }

    dependencies {
        api project(":Blackbox")
        api project(":Integrator")
    }
}