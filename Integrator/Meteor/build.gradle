plugins {
    id("common-conventions")
    id("remapped-minecraft-conventions")
    id("intermod-dependency-conventions")
}

repositories {
    maven { url = "https://maven.meteordev.org/releases" }
    maven { url = "https://maven.meteordev.org/snapshots" }
}

dependencies {
    minecraft "com.mojang:minecraft:1.20.1"
    mappings "net.fabricmc:yarn:1.20.1+build.10:v2"
    modImplementation "meteordevelopment:meteor-client:0.6.0-SNAPSHOT"
}